packages:
  - ui/**/*
  - bin

allowBuilds:
  esbuild: true
  ttf2woff2: false
catalog:
  breakpoint-sass: github:WandererXII/breakpoint#4.1
  shogiground: ^0.10.3
  shogiops: ^0.21.0
  snabbdom: ^3.6.4

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - shogiops
  - shogiground
  - breakpoint-sass
  - '@typescript/native-preview*'

patchedDependencies:
  '@toast-ui/editor': patches/@toast-ui__editor.patch

savePrefix: ''
