name: Build ui

on:
  push:
    paths:
      - '.github/workflows/ui.yml'
      - 'ui/**'
      - 'bin/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.stylelintrc.json'
      - '.prettierignore'
      - '.editorconfig'
  pull_request:
    paths:
      - '.github/workflows/ui.yml'
      - 'ui/**'
      - 'bin/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'biome.json'
      - '.stylelintrc.json'
      - '.prettierignore'
      - '.editorconfig'

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: 'pnpm'
      - name: 'Install pnpm dependencies'
        run: pnpm install
      - name: 'Build'
        run: pnpm ui:build
      - name: 'Type check'
        run: pnpm ui:type-check
      - name: 'Lint'
        run: pnpm ui:lint
      - name: 'Format'
        run: pnpm ui:format
